<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Hotlist - Track What to Watch</title>
    <meta name="description" content="Track movie and TV show recommendations from friends. Never forget what to watch next." />
    <meta name="theme-color" content="#FF6600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hotlist" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9999;font-family:system-ui,sans-serif;">
        <div style="font-size:2.5rem;margin-bottom:0.5rem;">🔥</div>
        <div style="font-size:1.25rem;font-weight:700;color:#111;letter-spacing:-0.02em;">Hotlist</div>
        <div style="margin-top:1.5rem;width:2rem;height:2rem;border:3px solid #f0f0f0;border-top-color:#FF6600;border-radius:50%;animation:spin 0.7s linear infinite;"></div>
        <style>#splash{transition:opacity 0.3s ease}@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
